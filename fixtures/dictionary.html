<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Fixture: dictionary punctuation selection</title>
  <style>
    body { margin: 40px 24px; font: 18px/1.6 Arial, sans-serif; }
    header { height: 120px; color: #666; }
    article { position: relative; z-index: 2000; box-sizing: border-box; height: 700px; padding: 24px; border: 1px solid #ddd; border-radius: 24px; box-shadow: 0 8px 12px #dce4e8; }
    h1 { margin: 0 0 16px; }
    .language { display: inline-block; padding: 10px 20px; background: #e2f0ff; border-radius: 16px; }
    #example { position: relative; margin-top: 114px; }
    #search-bubble { position: absolute; top: calc(100% + 8px); left: 136px; width: 132px; height: 54px; border: 1px solid #ddd; border-radius: 30px; background: #fafafa; box-shadow: 0 2px 3px #ddd; font: inherit; }
    #search-bubble[hidden] { display: none; }
    footer { min-height: 800px; padding-top: 40px; }
    .nested-scroll { height: 440px; overflow: auto; }
  </style>
</head>
<body>
  <header>Dictionary result</header>
  <div id="scroll-panel">
    <article>
      <h1>hi <small>[haɪ]</small></h1>
      <span class="language">英语 到 中文</span>
      <p>叹词<br />（用于打招呼）喂，嗨</p>
      <div id="example"><span id="phrase">"Hi guys!" 嗨，伙计们！</span><button id="search-bubble" hidden>⌕　，</button></div>
    </article>
  </div>
  <footer>相关搜索</footer>
  <script>
    const params = new URLSearchParams(location.search);
    if (params.has('nested')) document.querySelector('#scroll-panel').className = 'nested-scroll';
    if (params.has('tall-comma')) {
      document.querySelector('#phrase').innerHTML = '"Hi guys!" 嗨<span id="tall-comma" style="display:inline-block;height:240px;vertical-align:top">，</span>伙计们！';
    }
    document.addEventListener('mouseup', () => {
      document.querySelector('#search-bubble').hidden = params.has('no-bubble') || getSelection()?.toString() !== '，';
    });
  </script>
</body>
</html>
