<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep ink glass background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2d42"/>
      <stop offset="0.55" stop-color="#1b1d30"/>
      <stop offset="1" stop-color="#12131f"/>
    </linearGradient>
    <!-- Fluorescent highlighter stroke -->
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff176"/>
      <stop offset="0.5" stop-color="#ffe600"/>
      <stop offset="1" stop-color="#ffd60a"/>
    </linearGradient>
    <!-- Top sheen for the liquid-glass feel -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orbY" cx="0.32" cy="0.28" r="0.9">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#ffe600"/>
      <stop offset="1" stop-color="#e6c200"/>
    </radialGradient>
    <radialGradient id="orbT" cx="0.32" cy="0.28" r="0.9">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#4dd0c4"/>
      <stop offset="1" stop-color="#2aa79b"/>
    </radialGradient>
    <radialGradient id="orbP" cx="0.32" cy="0.28" r="0.9">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#f6a8c0"/>
      <stop offset="1" stop-color="#e07a9c"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- macOS squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#sheen)"/>
  <rect x="20" y="20" width="472" height="472" rx="108" fill="none"
        stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>

  <!-- Abstract text lines of a page -->
  <g stroke-linecap="round">
    <line x1="112" y1="150" x2="400" y2="150" stroke="#9aa0b5" stroke-width="26" opacity="0.85"/>
    <line x1="112" y1="330" x2="336" y2="330" stroke="#9aa0b5" stroke-width="26" opacity="0.6"/>
    <line x1="112" y1="410" x2="264" y2="410" stroke="#6d7390" stroke-width="26" opacity="0.45"/>
  </g>

  <!-- The fluorescent highlight sweep over the middle line -->
  <g>
    <rect x="88" y="200" width="336" height="80" rx="40" fill="url(#hl)" filter="url(#soft)" opacity="0.55"/>
    <rect x="88" y="202" width="336" height="76" rx="38" fill="url(#hl)"/>
    <rect x="88" y="202" width="336" height="34" rx="17" fill="#ffffff" opacity="0.28"/>
    <line x1="128" y1="240" x2="380" y2="240" stroke="#5c4a00" stroke-width="26"
          stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- Palette orbs -->
  <circle cx="404" cy="384" r="34" fill="url(#orbY)"/>
  <circle cx="404" cy="384" r="34" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
  <circle cx="330" cy="416" r="24" fill="url(#orbT)"/>
  <circle cx="330" cy="416" r="24" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2"/>
  <circle cx="376" cy="452" r="17" fill="url(#orbP)"/>
  <circle cx="376" cy="452" r="17" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2"/>
</svg>
