<svg width="860" height="300" viewBox="0 0 860 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Locus 文迹">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2d42"/>
      <stop offset="0.55" stop-color="#1b1d30"/>
      <stop offset="1" stop-color="#12131f"/>
    </linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff176"/>
      <stop offset="0.5" stop-color="#ffe600"/>
      <stop offset="1" stop-color="#ffd60a"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orbY" cx="0.32" cy="0.28" r="0.9">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#ffe600"/>
      <stop offset="1" stop-color="#e6c200"/>
    </radialGradient>
    <radialGradient id="orbT" cx="0.32" cy="0.28" r="0.9">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#4dd0c4"/>
      <stop offset="1" stop-color="#2aa79b"/>
    </radialGradient>
    <radialGradient id="orbP" cx="0.32" cy="0.28" r="0.9">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#f6a8c0"/>
      <stop offset="1" stop-color="#e07a9c"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- App icon, miniature -->
  <g transform="translate(48,54)">
    <rect width="192" height="192" rx="44" fill="url(#bg)"/>
    <rect width="192" height="192" rx="44" fill="url(#sheen)"/>
    <rect x="1.5" y="1.5" width="189" height="189" rx="42.5" fill="none"
          stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>
    <g stroke-linecap="round">
      <line x1="42" y1="56" x2="150" y2="56" stroke="#9aa0b5" stroke-width="10" opacity="0.85"/>
      <line x1="42" y1="124" x2="126" y2="124" stroke="#9aa0b5" stroke-width="10" opacity="0.6"/>
      <line x1="42" y1="154" x2="99" y2="154" stroke="#6d7390" stroke-width="10" opacity="0.45"/>
    </g>
    <rect x="33" y="75" width="126" height="30" rx="15" fill="url(#hl)" filter="url(#soft)" opacity="0.5"/>
    <rect x="33" y="76" width="126" height="28" rx="14" fill="url(#hl)"/>
    <rect x="33" y="76" width="126" height="12" rx="6" fill="#ffffff" opacity="0.28"/>
    <line x1="48" y1="90" x2="143" y2="90" stroke="#5c4a00" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
    <circle cx="151" cy="144" r="13" fill="url(#orbY)"/>
    <circle cx="124" cy="156" r="9" fill="url(#orbT)"/>
    <circle cx="141" cy="169" r="6.5" fill="url(#orbP)"/>
  </g>

  <!-- Wordmark -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'PingFang SC', sans-serif">
    <!-- Highlight sweep behind the word -->
    <rect x="286" y="106" width="332" height="64" rx="32" fill="url(#hl)" opacity="0.9"/>
    <rect x="286" y="106" width="332" height="26" rx="13" fill="#ffffff" opacity="0.25"/>
    <text x="300" y="158" font-size="84" font-weight="700" fill="#12131f" letter-spacing="1">Locus</text>
    <rect x="638" y="106" width="176" height="64" rx="32" fill="url(#bg)"/>
    <rect x="638" y="106" width="176" height="26" rx="13" fill="#ffffff" opacity="0.16"/>
    <text x="668" y="153" font-size="46" font-weight="600" fill="#f5f5f7">文迹</text>
    <text x="300" y="216" font-size="24" fill="#9aa0b5" letter-spacing="0.4">
      Local-first annotations for academic reading
    </text>
    <text x="300" y="252" font-size="20" fill="#6d7390" letter-spacing="0.3">
      本地优先 · 学术阅读高亮与笔记 · Chrome / Edge
    </text>
  </g>
